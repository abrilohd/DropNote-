[project]
name = "dropnote"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abrilohd", email = "abrsh067@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "dj-database-url>=2.3,<3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[project.scripts]
dropnote = "dropnote:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
